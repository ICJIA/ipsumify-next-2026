name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The token can read the repository and nothing else. Actions are pinned to
# commits, not tags (a tag can be moved); Dependabot still updates them.
permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Run type checking
        run: yarn typecheck

      - name: Run tests
        run: yarn test:coverage

      # Codecov refuses tokenless uploads to a protected branch, and without a
      # token this step used to fail on every run while fail_ci_if_error: false
      # reported it green. It now runs only once a CODECOV_TOKEN secret exists,
      # and a configured upload that breaks fails the job instead of hiding.
      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: always() && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The command Netlify runs. `yarn generate` forces a fully static build
      # and drops the /api/generate function, so it never tested what ships.
      - name: Build project
        run: yarn build

      - name: Verify the Netlify output
        run: |
          test -f dist/index.html
          test -d .netlify/functions-internal/server
          grep -q "Content-Security-Policy: default-src 'self'; script-src 'self' 'sha256-" dist/_headers

      - name: Build the npm package
        run: yarn build:cli

      - name: Run the npm package
        run: |
          test "$(node packages/ipsumify/dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
          test "$(node packages/ipsumify/dist/cli.js | grep -c .)" = "5"
          node packages/ipsumify/dist/cli.js 2 --all --format html --seed 42 | grep -q '<h1>'

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build
          path: dist
          if-no-files-found: error
          retention-days: 7
