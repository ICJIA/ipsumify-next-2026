name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Run type checking
        run: yarn typecheck

      - name: Run tests
        run: yarn test:coverage

      # Codecov refuses tokenless uploads to a protected branch, and without a
      # token this step used to fail on every run while fail_ci_if_error: false
      # reported it green. It now runs only once a CODECOV_TOKEN secret exists,
      # and a configured upload that breaks fails the job instead of hiding.
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always() && env.CODECOV_TOKEN != ''
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The command Netlify runs. `yarn generate` forces a fully static build
      # and drops the /api/generate function, so it never tested what ships.
      - name: Build project
        run: yarn build

      - name: Verify the Netlify output
        run: |
          test -f dist/index.html
          test -d .netlify/functions-internal/server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist
          if-no-files-found: error
          retention-days: 7
